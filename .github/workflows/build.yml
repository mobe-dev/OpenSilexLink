# Reused by tag releases so publication waits for all package install checks.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Optional release tag, including its v prefix
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install pytest PySide6
          packaging/install-nfpm.sh
      - name: Build packages
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' client/pyproject.toml)
          if [ -n "$RELEASE_TAG" ]; then version="${RELEASE_TAG#v}"; fi
          PYTHON=python packaging/build-packages.sh "$version" dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          if-no-files-found: error
          path: |
            dist/release/opensilexlink_*.deb
            dist/release/opensilexlink-*.rpm
            dist/release/THIRD_PARTY_NOTICES.txt
            dist/release/SHA256SUMS

  install-test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie
            install: apt-get update && apt-get install -y ./dist/*.deb python3-pyside6.qtwidgets
          - image: ubuntu:26.04
            install: apt-get update && apt-get install -y ./dist/*.deb
          - image: fedora:45
            install: dnf install -y ./dist/*.rpm python3-pyside6
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Verify checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Install the package
        run: ${{ matrix.install }}
      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          silex-daemon --version
          osl --version
          test -x /usr/libexec/silex-usbip-helper
          test -f /usr/share/polkit-1/actions/org.opensilexlink.policy
          test -f /usr/share/applications/opensilexlink.desktop
          test -f /usr/lib/systemd/system/opensilexlink.service
          test -s /usr/share/doc/opensilexlink/THIRD_PARTY_NOTICES.txt
          getent group opensilexlink
          python3 -c "import sys; sys.path.insert(0, '/usr/lib/opensilexlink'); from PySide6 import QtWidgets; app = QtWidgets.QApplication([]); from opensilexlink.gui.app import MainWindow; print('GUI ok')"
