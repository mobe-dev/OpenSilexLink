# nfpm config for the OpenSilexLink .deb / .rpm packages. One config builds both
# formats; packaging/build-packages.sh runs the prerequisites (daemon release build,
# compiled German catalog) and calls nfpm:
#
#   packaging/build-packages.sh 1.1.0
#
# ${VERSION} is expanded from the environment (set by build-packages.sh).

name: opensilexlink
arch: amd64            # nfpm maps amd64 -> x86_64 for the rpm automatically
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: "OpenSilexLink contributors"
description: |
  Open-source Linux replacement for Silex SX Virtual Link.
  Bridges a Silex USB device server (USB-over-Ethernet) to the kernel's USB/IP
  stack: a userspace daemon speaks the Silex protocol, a PySide6 GUI drives it.
  DS-600 storage and Bluetooth validated on Ubuntu 26.04.
vendor: "OpenSilexLink (unofficial)"
homepage: https://github.com/mobe-dev/OpenSilexLink
license: MIT

# Desktop and USB/IP dependencies are required; packages install a working app.
depends:
  - python3
overrides:
  deb:
    depends:
      - python3 (>= 3.9)
      - python3-pyside6.qtwidgets
      - usbip | linux-tools-generic
      - kmod
      - systemd
      - passwd
      - sudo
      - libc6 (>= 2.39)
    recommends:
      - pkexec
      - polkitd
  rpm:
    depends:
      - python3 >= 3.9
      - python3-pyside6
      - usbip
      - kmod
      - systemd
      - shadow-utils
      - sudo
      - glibc >= 2.39
    recommends:
      - polkit

scripts:
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh

contents:
  - src: ./packaging/needrestart/opensilexlink.conf
    dst: /etc/needrestart/conf.d/opensilexlink.conf
    type: config
    file_info:
      mode: 0644
  - src: ./packaging/opensilexlink.svg
    dst: /usr/share/icons/hicolor/scalable/apps/opensilexlink.svg
    file_info:
      mode: 0644
  - src: ./packaging/systemd/opensilexlink.service
    dst: /usr/lib/systemd/system/opensilexlink.service
    file_info:
      mode: 0644
  - src: ./packaging/systemd/silex-connect@.service
    dst: /usr/lib/systemd/system/silex-connect@.service
    file_info:
      mode: 0644
  - src: ./packaging/build/copyright
    dst: /usr/share/doc/opensilexlink/copyright
    file_info:
      mode: 0644
  - src: ./packaging/build/THIRD_PARTY_NOTICES.txt
    dst: /usr/share/doc/opensilexlink/THIRD_PARTY_NOTICES.txt
    file_info:
      mode: 0644
  - src: ./docs/licensing.md
    dst: /usr/share/doc/opensilexlink/licensing.md
    file_info:
      mode: 0644
  - src: ./docs/ds600-firmware.md
    dst: /usr/share/doc/opensilexlink/ds600-firmware.md
    file_info:
      mode: 0644
  - src: ./docs/ds600-recovery.md
    dst: /usr/share/doc/opensilexlink/ds600-recovery.md
    file_info:
      mode: 0644
  - src: ./docs/operations.md
    dst: /usr/share/doc/opensilexlink/operations.md
    file_info:
      mode: 0644
  - src: ./docs/ds600.md
    dst: /usr/share/doc/opensilexlink/ds600.md
    file_info:
      mode: 0644
  - src: ./docs/displaylink.md
    dst: /usr/share/doc/opensilexlink/displaylink.md
    file_info:
      mode: 0644
  # Rust daemon binary.
  - src: ./daemon/target/release/silex-daemon
    dst: /usr/bin/silex-daemon
    file_info:
      mode: 0755

  # Python client (whole package tree, including the compiled .mo catalogs).
  - src: ./packaging/build/client/opensilexlink
    dst: /usr/lib/opensilexlink/opensilexlink
    type: tree

  # CLI / GUI launchers on PATH.
  - src: ./packaging/wrappers/osl
    dst: /usr/bin/osl
    file_info:
      mode: 0755
  - src: ./packaging/wrappers/osl-gui
    dst: /usr/bin/osl-gui
    file_info:
      mode: 0755

  # Menu entry for the GUI.
  - src: ./packaging/wrappers/opensilexlink-askpass
    dst: /usr/libexec/opensilexlink-askpass
    file_info:
      mode: 0755

  - src: ./packaging/opensilexlink.desktop
    dst: /usr/share/applications/opensilexlink.desktop
    file_info:
      mode: 0644

  # Privileged USB/IP helper (attach/detach/modprobe with strict arg validation).
  - src: ./packaging/helper/silex-usbip-helper
    dst: /usr/libexec/silex-usbip-helper
    file_info:
      mode: 0755

  # Authenticated development-mode helper policy.
  - src: ./packaging/polkit/org.opensilexlink.policy
    dst: /usr/share/polkit-1/actions/org.opensilexlink.policy
    file_info:
      mode: 0644
